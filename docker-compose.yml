# docker compose up -d --build                 → http://localhost:8080
# docker compose --profile https up -d --build → https://$DOMAIN (Caddy + Let's Encrypt)
# Settings come from .env (see .env.example).
name: baby-utils

services:
  web:
    build: .
    image: baby-utils:local
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  caddy:
    profiles: [https]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-}
    # Fail with a clear message instead of Caddy's "unrecognized global option" when unset.
    command: >-
      sh -c '[ -n "$$DOMAIN" ] || { echo "caddy: set DOMAIN in .env for the https profile" >&2; exit 1; };
      exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

volumes:
  caddy-data:
  caddy-config:
