# docker compose up -d --build → https://baby-utils.$DOMAIN via the external Traefik proxy:
# `web` serves the PWA, `api` the optional end-to-end encrypted sync relay under /api/sync.
# Settings come from .env (see .env.example). Requires the external `proxy` network that
# Traefik is attached to (docker network create proxy).
name: baby-utils

services:
  web:
    build: .
    image: baby-utils:local
    container_name: baby-utils-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ ALL ]
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    # Health check comes from the image (wget http://127.0.0.1:8080/healthz).
    labels:
      - traefik.enable=true
      # Catch-all for the host -> the built SPA (nginx serves the SPA fallback).
      - traefik.http.routers.baby-utils-web.rule=Host(`baby-utils.${DOMAIN}`)
      - traefik.http.routers.baby-utils-web.entrypoints=websecure
      - traefik.http.routers.baby-utils-web.priority=1
      - traefik.http.routers.baby-utils-web.service=baby-utils-web
      - traefik.http.services.baby-utils-web.loadbalancer.server.port=8080

  # Optional sync API (relay): buffers and forwards end-to-end encrypted messages between the
  # phones of a sync group. It never sees keys or plaintext. Same host, under /api/sync.
  api:
    build:
      context: .
      target: api
    image: baby-utils-api:local
    container_name: baby-utils-api
    restart: unless-stopped
    read_only: true
    cap_drop: [ ALL ]
    security_opt:
      - no-new-privileges:true
    volumes:
      - api-data:/data
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.baby-utils-api.rule=Host(`baby-utils.${DOMAIN}`) && PathPrefix(`/api/sync`)
      - traefik.http.routers.baby-utils-api.entrypoints=websecure
      - traefik.http.routers.baby-utils-api.priority=10
      - traefik.http.routers.baby-utils-api.service=baby-utils-api
      - traefik.http.services.baby-utils-api.loadbalancer.server.port=8787

volumes:
  api-data:

networks:
  proxy:
    external: true
