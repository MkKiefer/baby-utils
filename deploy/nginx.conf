# Static server for the built PWA (dist/). Runs as the unprivileged nginx user on :8080;
# TLS is terminated in front of it by the external Traefik proxy.

server_tokens off;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json
           application/manifest+json image/svg+xml image/x-icon;

# Vite's hashed output never changes, so it may be cached forever. Everything else
# (index.html, sw.js, manifest, icons) must be revalidated so a new deploy reaches devices;
# the service worker keeps the app offline-capable either way.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /srv/baby-utils;
    charset utf-8;

    # Headers are inherited by every location below as long as none uses add_header itself.
    # 'unsafe-inline' styles: Vue renders static style="" attributes via innerHTML.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $cache_control;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # A missing chunk must 404 rather than fall back to index.html (wrong MIME type).
    location /assets/ {
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # The sync API is routed to the relay container by Traefik; a request that still lands
    # here must not get the SPA shell.
    location /api/ {
        return 404;
    }

    # SPA: client-side routes (/app/feed/history, …) load the shell.
    location / {
        try_files $uri /index.html;
    }
}
